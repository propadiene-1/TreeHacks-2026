<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · med sec</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
        input, select, button { display: block; margin: 10px 0; padding: 10px; width: 300px; }
        button { background: #667eea; color: white; border: none; cursor: pointer; border-radius: 8px; }
        #status { margin-top: 20px; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        table { border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #667eea; color: white; }
        .chart-section { margin-top: 40px; padding: 20px; background: #f8fcfd; border-radius: 12px; border: 1px solid #e0e8ec; }
        .chart-section h2 { margin: 0 0 16px 0; font-size: 1.25rem; color: #333; }
        .chart-wrap { position: relative; height: 280px; }
        .readings-table-section { margin-top: 28px; }
        .readings-table-section h3 { margin: 0 0 14px 0; font-size: 1.1rem; font-weight: 600; color: #333; }
        .pain-readings-table-wrap {
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid #e0e8ec;
            box-shadow: 0 2px 8px rgba(54, 134, 176, 0.06);
            background: #fff;
        }
        .pain-readings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .pain-readings-table thead th {
            background: linear-gradient(135deg, #5ca4c4 0%, #3686b0 100%);
            color: #fff;
            font-weight: 600;
            text-align: left;
            padding: 14px 18px;
            white-space: nowrap;
        }
        .pain-readings-table thead th:first-child { padding-left: 20px; }
        .pain-readings-table thead th:last-child { padding-right: 20px; }
        .pain-readings-table tbody tr {
            border-bottom: 1px solid #eef4f7;
            transition: background 0.15s ease;
        }
        .pain-readings-table tbody tr:hover { background: #f8fcfd; }
        .pain-readings-table tbody tr:last-child { border-bottom: none; }
        .pain-readings-table tbody tr:nth-child(even) { background: #fafcfd; }
        .pain-readings-table tbody tr:nth-child(even):hover { background: #f0f8fb; }
        .pain-readings-table td {
            padding: 14px 18px;
            color: #333;
        }
        .pain-readings-table td:first-child { padding-left: 20px; font-weight: 500; color: #2477a6; }
        .pain-readings-table td:last-child { padding-right: 20px; }
        .pain-readings-table td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
            color: #444;
        }
        .pain-readings-table .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .pain-readings-table .improved .badge {
            background: #d4edda;
            color: #155724;
        }
        .pain-readings-table .worse .badge {
            background: #f8d7da;
            color: #721c24;
        }
        .pain-readings-table .same .badge {
            background: #e9ecef;
            color: #495057;
        }
    </style>
</head>
<body>
    <h1>📞 Test Scheduler</h1>
    
    <input type="tel" id="phoneNumber" placeholder="+15551234567">
    
    <select id="frequency">
        <option value="">Select frequency</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
    </select>
    
    <input type="time" id="time" value="09:00">
    
    <button id="scheduleCallButton">Schedule Call</button>
    <button id="displayScheduledCalls">Show Scheduled Calls</button>
    
    <div id="status"></div>
    <div id="scheduledCallsList"></div>

    <section class="chart-section" aria-label="Pain over time">
        <h2>Pain over time</h2>
        <div class="chart-wrap">
            <canvas id="painChart"></canvas>
        </div>
        <div class="readings-table-section">
            <h3>Readings per day</h3>
            <div id="painReadingsTable"></div>
        </div>
    </section>

    <script>
        console.log('Script loaded!');
        
        const phoneInput = document.getElementById('phoneNumber');
        const frequencyInput = document.getElementById('frequency');
        const timeInput = document.getElementById('time');
        const scheduleCallButton = document.getElementById('scheduleCallButton');
        const displayScheduledCalls = document.getElementById('displayScheduledCalls');
        const scheduledCallsList = document.getElementById('scheduledCallsList');
        const statusDiv = document.getElementById('status');
        
        console.log('Elements found:', { phoneInput, frequencyInput, scheduleCallButton });

        // Schedule button
        scheduleCallButton.addEventListener('click', async () => {
            console.log('Button clicked!');
            
            const phoneNumber = phoneInput.value.trim();
            const frequency = frequencyInput.value;
            const time = timeInput.value;
            
            console.log('Values:', { phoneNumber, frequency, time });
            
            if (!phoneNumber) {
                alert('Please enter phone number');
                return;
            }
            
            if (!frequency) {
                alert('Please select frequency');
                return;
            }
            
            try {
                const response = await fetch('/schedule-recurring', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber, frequency, time })
                });
                
                const data = await response.json();
                console.log('Response:', data);
                
                if (response.ok) {
                    statusDiv.textContent = '✅ ' + data.message;
                    statusDiv.className = 'success';
                    loadScheduledCalls();
                } else {
                    statusDiv.textContent = '❌ ' + data.error;
                    statusDiv.className = 'error';
                }
            } catch (error) {
                console.error('Error:', error);
                statusDiv.textContent = '❌ Failed: ' + error.message;
                statusDiv.className = 'error';
            }
        });

        // Display button
        displayScheduledCalls.addEventListener('click', loadScheduledCalls);

        async function loadScheduledCalls() {
            console.log('Loading scheduled calls...');
            
            try {
                const response = await fetch('/scheduled-calls');
                const data = await response.json();
                console.log('Scheduled calls:', data);
                
                if (data.calls.length === 0) {
                    scheduledCallsList.innerHTML = '<p>No scheduled calls</p>';
                    return;
                }
                
                let html = '<table><tr><th>ID</th><th>Phone</th><th>Frequency</th><th>Time</th></tr>';
                data.calls.forEach(call => {
                    html += `<tr>
                        <td>${call.id}</td>
                        <td>${call.phoneNumber}</td>
                        <td>${call.frequency}</td>
                        <td>${call.time}</td>
                    </tr>`;
                });
                html += '</table>';
                scheduledCallsList.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading calls:', error);
                scheduledCallsList.innerHTML = '<p style="color:red;">Error loading calls</p>';
            }
        }
        
        // Auto-load on page load
        loadScheduledCalls();

        /**
         * Create a line graph: reported pain, expected pain (from mood & physical), and actual pain (corrected for perception bias + baseline).
         * Actual pain is fetched from POST /api/actual-pain (algorithm in pain-correction.js).
         * @param {string} canvasId - Id of the <canvas> element.
         * @param {Array<{date: string, mood: number, physicalCondition: number, painRating: number}>} timeseries - 0–10 scales.
         * @param {Object} [options] - Optional { baseline } for fixed baseline pain.
         * @returns {Promise<Chart>} Chart.js instance.
         */
        async function createPainLineGraph(canvasId, timeseries, options = {}) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return null;

            const labels = timeseries.map(d => d.date);
            const reportedPain = timeseries.map(d => d.painRating);

            // Expected pain from mood & physical only (no baseline): 10 - (mood + physical)/2
            function expectedFromMoodAndPhysical(mood, physicalCondition) {
                const raw = 10 - (mood + physicalCondition) / 2;
                return Math.max(0, Math.min(10, raw));
            }
            const expectedPain = timeseries.map(d => expectedFromMoodAndPhysical(d.mood, d.physicalCondition));

            // Actual pain: perception-bias correction + baseline (from server algorithm)
            let actualPainData = [];
            let actualPain = [];
            try {
                const res = await fetch('/api/actual-pain', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ timeseries, options })
                });
                const json = await res.json();
                if (json.data && json.data.length) {
                    actualPainData = json.data;
                    actualPain = actualPainData.map(r => r.actualPain);
                }
            } catch (e) {
                console.warn('Actual pain API failed, using corrected only in UI', e);
                actualPain = timeseries.map(() => null);
            }
            const hasActual = actualPain.length === labels.length && actualPain.some(v => v != null);

            if (window._painChartInstance) {
                window._painChartInstance.destroy();
            }

            const datasets = [
                {
                    label: 'Reported pain',
                    data: reportedPain,
                    borderColor: '#667eea',
                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                    fill: true,
                    tension: 0.3
                },
                {
                    label: 'Expected pain (from mood & physical)',
                    data: expectedPain,
                    borderColor: '#82c0d8',
                    backgroundColor: 'rgba(130, 192, 216, 0.05)',
                    borderDash: [5, 5],
                    fill: false,
                    tension: 0.3
                }
            ];
            if (hasActual) {
                datasets.push({
                    label: 'Actual pain (corrected + baseline)',
                    data: actualPain,
                    borderColor: '#2477a6',
                    backgroundColor: 'rgba(36, 119, 166, 0.1)',
                    fill: false,
                    tension: 0.3
                });
            }

            window._painChartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            min: 0,
                            max: 10,
                            title: { display: true, text: 'Pain / score (0–10)' }
                        },
                        x: { title: { display: true, text: 'Date' } }
                    },
                    plugins: { legend: { position: 'top' } }
                }
            });

            // Table: readings per day, baseline, pain improved
            if (actualPainData.length) {
                renderPainReadingsTable(actualPainData);
            }

            return window._painChartInstance;
        }

        /**
         * Render table: Date | Reported | Baseline | Actual | Pain improved
         * @param {Array<{date?: string, reportedPain: number, baseline: number, actualPain: number}>} data - from /api/actual-pain
         */
        function renderPainReadingsTable(data) {
            const container = document.getElementById('painReadingsTable');
            if (!container) return;
            const thresh = 0.3; // same if |baseline - actual| <= thresh
            let html = '<div class="pain-readings-table-wrap"><table class="pain-readings-table"><thead><tr><th>Date</th><th>Reported pain</th><th>Baseline pain</th><th>Actual pain</th><th>Pain improved</th></tr></thead><tbody>';
            data.forEach(row => {
                const baseline = row.baseline != null ? row.baseline.toFixed(1) : '—';
                const actual = row.actualPain != null ? row.actualPain.toFixed(1) : '—';
                const diff = row.baseline != null && row.actualPain != null ? row.baseline - row.actualPain : null;
                let improved = '—';
                let cls = '';
                if (diff != null) {
                    if (diff > thresh) {
                        improved = '<span class="badge">Yes (' + diff.toFixed(1) + ')</span>';
                        cls = 'improved';
                    } else if (diff < -thresh) {
                        improved = '<span class="badge">Worse (' + (-diff).toFixed(1) + ')</span>';
                        cls = 'worse';
                    } else {
                        improved = '<span class="badge">Same</span>';
                        cls = 'same';
                    }
                }
                html += `<tr>
                    <td>${escapeHtml(row.date || '—')}</td>
                    <td class="num">${row.reportedPain != null ? row.reportedPain.toFixed(1) : '—'}</td>
                    <td class="num">${baseline}</td>
                    <td class="num">${actual}</td>
                    <td class="${cls}">${improved}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        // Demo: sample timeseries; chart uses /api/actual-pain for actual pain line + table
        const sampleTimeseries = [
            { date: '02-08', mood: 5, physicalCondition: 4, painRating: 5 },
            { date: '02-09', mood: 4, physicalCondition: 5, painRating: 5 },
            { date: '02-10', mood: 6, physicalCondition: 5, painRating: 4 },
            { date: '02-11', mood: 5, physicalCondition: 4, painRating: 5 },
            { date: '02-12', mood: 7, physicalCondition: 6, painRating: 3 },
            { date: '02-13', mood: 6, physicalCondition: 6, painRating: 4 },
            { date: '02-14', mood: 6, physicalCondition: 5, painRating: 4 }
        ];
        createPainLineGraph('painChart', sampleTimeseries);
    </script>
</body>
</html>
